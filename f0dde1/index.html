<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時計ウィジェット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #FAE9F1;
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #C14C8A;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .wrap { container-type: inline-size; width: 100%; text-align: center; padding: 4cqw 2cqw; }
  .time { font-size: 12.5cqw; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.25; } }
  .line { width: 55%; height: 2px; background: rgba(193,76,138,0.35); margin: 3cqw auto; border-radius: 2px; }
  .date { font-size: 4.3cqw; font-weight: 500; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="time"><span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span></div>
    <div class="line"></div>
    <div class="date" id="date"></div>
  </div>
<script>
  const wd = ['日','月','火','水','木','金','土'];
  function tick() {
    const n = new Date();
    const p = x => String(x).padStart(2,'0');
    document.getElementById('hh').textContent = p(n.getHours());
    document.getElementById('mm').textContent = p(n.getMinutes());
    document.getElementById('ss').textContent = p(n.getSeconds());
    document.getElementById('date').textContent = n.getFullYear() + '/' + p(n.getMonth()+1) + '/' + p(n.getDate()) + ' (' + wd[n.getDay()] + ')';
  }
  tick(); setInterval(tick, 250);
</script>
</body>
</html>
